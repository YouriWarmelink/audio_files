<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anouk-Vrijgezellen-Feest</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #f953c6, #b91d73, #7b2ff7, #f953c6);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #play-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.6);
    }

    #play-btn svg { width: 52px; height: 52px; fill: #fff; }

    #play-btn.playing svg { display: none; }
    #play-btn.playing::after {
      content: '❚❚';
      color: #fff;
      font-size: 30px;
      letter-spacing: 4px;
    }

    #error {
      color: #fff;
      font-family: sans-serif;
      font-size: 18px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <button id="play-btn" aria-label="Afspelen">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <div id="error" style="display:none">Geen audio gevonden.</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');
    if (!file) {
      document.getElementById('play-btn').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
    const audio = new Audio('audio/' + file);
    const btn = document.getElementById('play-btn');

    audio.addEventListener('error', () => {
      btn.style.display = 'none';
      document.getElementById('error').style.display = 'block';
    });

    btn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btn.classList.add('playing');
      } else {
        audio.pause();
        btn.classList.remove('playing');
      }
    });

    audio.addEventListener('ended', () => btn.classList.remove('playing'));
  </script>

</body>
</html>
