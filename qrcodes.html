<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>QR Codes - Vrijgezellenfeest</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #b91d73;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 30px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .card h2 {
      font-size: 15px;
      margin-top: 12px;
      text-align: center;
      color: #333;
    }

    .card p {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    @media print {
      button { display: none; }
    }

    .print-btn {
      display: block;
      margin: 0 auto 30px;
      padding: 10px 28px;
      background: #b91d73;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>QR Codes - Vrijgezellenfeest Anouk</h1>
  <button class="print-btn" onclick="window.print()">Afdrukken</button>
  <div class="grid" id="grid"></div>

  <script>
    const base = 'https://youriwarmelink.github.io/audio_files/?file=';

    const files = [
      'Aileen (2017).mp3',
      'Bente (2016).mp3',
      'Dorien (2020).mp3',
      'Iris (2021).mp3',
      'Josien (2019).mp3',
      'Kaira (2019).mp3',
      'Kim (2023).mp3',
      'Leona (2020).mp3',
      'Linda (2023).mp3',
      'Maaike (2019).mp3',
      'Maike (2020).mp3',
      'Roos (2021).mp3',
    ];

    const grid = document.getElementById('grid');

    files.forEach(file => {
      const name = file.replace(/\s*\(\d{4}\)\.mp3$/, '');
      const year = file.match(/\((\d{4})\)/)?.[1];
      const url = base + encodeURIComponent(file);

      const card = document.createElement('div');
      card.className = 'card';

      const qrDiv = document.createElement('div');
      card.appendChild(qrDiv);

      const h2 = document.createElement('h2');
      h2.textContent = name;
      card.appendChild(h2);

      const p = document.createElement('p');
      p.textContent = year;
      card.appendChild(p);

      grid.appendChild(card);

      new QRCode(qrDiv, {
        text: url,
        width: 160,
        height: 160,
      });
    });
  </script>

</body>
</html>
